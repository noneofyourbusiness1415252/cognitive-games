<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Mental Rotation - Cognitive Games</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root { --cell-size: calc(1em * sqrt(2)); }
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 2rem;
        }
        .timer {
            font-size: 1.5rem;
            text-align: center;
        }
        .grid {
            display: grid;
            gap: 0;
        }
        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: default;
            pointer-events: none;
            user-select: none;
        }
        .tile {
            background: var(--bg-2);
            pointer-events: auto;
            cursor: pointer;
        }
        .obstacle {
            background: var(--bg-2);
            pointer-events: none;
        }
        .arrow {
            display: inline-block;
            pointer-events: none;
            user-select: none;
        }
        .pointing-right    { transform: rotate(0deg); }
        .pointing-down     { transform: rotate(90deg); }
        .pointing-left     { transform: rotate(180deg); }
        .pointing-up       { transform: rotate(270deg); }
        .pointing-southeast{ transform: rotate(45deg); }
        .pointing-southwest{ transform: rotate(135deg); }
        .pointing-northwest{ transform: rotate(225deg); }
        .pointing-northeast{ transform: rotate(315deg); }
        .grid-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 3rem;
            overflow: visible;
        }
        .grid-container.animating { pointer-events: none; }
        .rocket, .earth {
            position: absolute;
            font-size: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            user-select: none;
        }
        .rocket { left: -2.25rem; }
        .earth  { right: -2.25rem; }
        .level  { font-size: 1.5rem; }
        #stats  { font-size: 1rem; color: var(--text-color); }
        #reset {
            margin-top: 0.5rem;
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.25rem;
            background: var(--bg-2);
            color: var(--text-color);
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="level">Level 1</div>
        <div class="timer">3:00</div>
        <div class="grid-container">
            <span class="rocket">🚀</span>
            <div id="grid" class="grid"></div>
            <span class="earth">🌍</span>
        </div>
        <div id="stats">Moves: 0  |  Rotations: 0  |  Reversals: 0</div>
        <button id="reset">Reset Level</button>
    </div>
    <script src="index.js"></script>
</body>
</html>
